name: rename-index-to-app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move index.html to app.html and restore original index.html
        run: |
          git config user.name "sonofheaven7"
          git config user.email "sonofheaven7@users.noreply.github.com"
          git mv index.html app.html
          git checkout c6299ca53d7ffe8d72b0c46703c8d03335ab2314 -- index.html
          git add -A
          git status --short
          git commit -m "نسخه ۲٫۵ (برچسب نسخه در فوتر)"
          git push origin HEAD:main






















